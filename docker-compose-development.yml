services:
  database:
    restart: always
    # Hardened image (dhi.io, needs `docker login dhi.io`), rebuilt by Docker as
    # its packages are patched. Postgres 18; the tag is the major version, so it
    # never moves to a major the data directory cannot open. See infra
    # docs/postgres-18.md.
    image: dhi.io/postgres:18-alpine3.23
    shm_size: ${DATABASE_SHM_SIZE}
    # The image's entrypoint starts postgres itself: only its arguments here.
    command: >
      -c config_file=/etc/postgresql.conf
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_min_duration_statement=${DATABASE_LOG_MIN_DURATION_STATEMENT}
      -c shared_buffers=${DATABASE_SHARED_BUFFERS}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read only when the cluster is first created. The builtin provider sorts
      # the same on every image, so an image update cannot reorder an index.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    volumes:
      # The image keeps the cluster in /var/lib/postgresql/18/data, owned by
      # uid 70. Required: an unset path would initialise an empty cluster.
      - "${DATABASE_CLUSTER_DIR:?DATABASE_CLUSTER_DIR is unset: run infra playbooks/postgres-upgrade.yml}:/var/lib/postgresql"
      - "${DATABASE_CONF_FILE}:/etc/postgresql.conf"
      - "${DATABASE_BACKUP_DIR}:/backup"
      - "${DATABASE_LOG_DIR}:/var/log/postgresql:z"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    restart: always
    image: redis:latest
    sysctls:
      net.core.somaxconn: 1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  django:
    restart: always
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: bash -c "DJANGO_SETTINGS_MODULE=backend.settings python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn --reload backend.wsgi:application --workers=${GUNICORN_WORKERS} --log-file=${GUNICORN_LOG}/gunicorn.log --log-level=${GUNICORN_LOG_LEVEL} -b '[::]:80' --worker-tmp-dir /dev/shm --timeout ${GUNICORN_TIMEOUT} "
    volumes:
      - ./src:/app
      - ${STATIC_ROOT}:${STATIC_ROOT}
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ${GUNICORN_LOG}:${GUNICORN_LOG}
      - ${DJANGO_LOG_DIR}:${DJANGO_LOG_DIR}
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",80),2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${EXTERNAL_PORT_DEVELOPMENT}:80"
  fastapi:
    restart: always
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: bash -c "fastapi run main.py --root-path /api/v2 --port 80 --reload --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./src:/app
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ${FASTAPI_LOG_DIR}:${FASTAPI_LOG_DIR}
      # let testcontainers spawn throwaway containers (e.g. Neo4j) from inside the test run
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
      django:
        condition: service_started
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",80),2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${FASTAPI_PORT}:80"
  neo4j:
    image: neo4j:5.26.33-enterprise-trixie
    restart: always
    ports:
      - 127.0.0.1:${NEO4J_7474_EXTERNAL_PORT}:7474
      - 127.0.0.1:${NEO4J_7687_EXTERNAL_PORT}:7687
    volumes:
      - ${NEO4J_CONF}:/conf
      - ${NEO4J_DATA}:/data
      - ${NEO4J_IMPORT}:/import
      - ${NEO4J_LOGS}:/logs
      - ${NEO4J_PLUGINS}:/plugins
      - ${NEO4J_BACKUP}:/backup
      - ${NEO4J_CERTIFICATES}:/ssl
    environment: 
      # Memory, sized to the store rather than to the host. Left unset, the JVM
      # sizes the heap ergonomically at 1/4 of RAM — 4GB on a 15GB dev box, two
      # orders of magnitude beyond a ~40MB store. That reservation is not free:
      # the frontend's 4-worker Playwright suite runs 4 Chromiums and 4 Vite
      # servers on the same machine, and renderers starved of memory die
      # mid-step, reporting "Target crashed" or an assertion whose Received is
      # `undefined` rather than a count.
      #
      # Initial == max on purpose: a heap that grows mid-run spikes latency
      # exactly when the browsers are competing for what it takes.
      #
      # Neo4j reads these as server.* settings with '.' -> '_' and a literal
      # '_' -> '__'. A dotted name (NEO4J_server.memory.heap.initial_size) is not
      # a shell variable, so the image never sees it and silently ignores it.
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-512m}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-256m}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_db_logs_query_enabled=OFF
      #- NEO4J_dbms_security_auth__enabled=false
      #- NEO4J_dbms.security.auth_lock_time=0s
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_apoc_trigger_enabled=true
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: wget -q --spider http://neo4j:7474 || exit 1
      interval: ${NEO4J_HEALTHCHECK_INTERVAL:-1s}
      timeout: ${NEO4J_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${NEO4J_HEALTHCHECK_RETRIES:-30}
      start_period: ${NEO4J_HEALTHCHECK_START_PERIOD:-10s}

  rabbitmq:
    # Every other long-running service here restarts; without this one the
    # broker stays down after a reboot and celery waits on a broker that is
    # never coming back.
    restart: always
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  celery:
    restart: always
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: celery -A backend worker --loglevel=info
    working_dir: /app
    volumes:
      - ./src:/app
      - ${CELERY_LOG_DIR}:${CELERY_LOG_DIR}
    depends_on:
      django:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s