services:
  database:
    restart: always
    # Docker's 10 s default can cut a shutdown checkpoint short.
    stop_grace_period: 60s
    # Hardened image (dhi.io, needs `docker login dhi.io`), rebuilt by Docker as
    # its packages are patched. Postgres 18; the tag is the major version, so it
    # never moves to a major the data directory cannot open. See infra
    # docs/postgres-18.md.
    image: dhi.io/postgres:18-alpine3.23
    shm_size: ${DATABASE_SHM_SIZE}
    # The image's entrypoint starts postgres itself: only its arguments here.
    command: >
      -c config_file=/etc/postgresql.conf
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_min_duration_statement=${DATABASE_LOG_MIN_DURATION_STATEMENT}
      -c shared_buffers=${DATABASE_SHARED_BUFFERS}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read only when the cluster is first created. The builtin provider sorts
      # the same on every image, so an image update cannot reorder an index.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    volumes:
      # The image keeps the cluster in /var/lib/postgresql/18/data, owned by
      # uid 70. Required: an unset path would initialise an empty cluster.
      - "${DATABASE_CLUSTER_DIR:?DATABASE_CLUSTER_DIR is unset: run infra playbooks/postgres-upgrade.yml}:/var/lib/postgresql"
      - "${DATABASE_CONF_FILE}:/etc/postgresql.conf"
      - "${DATABASE_BACKUP_DIR}:/backup"
      - "${DATABASE_LOG_DIR}:/var/log/postgresql:z"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    restart: always
    image: redis:8
    sysctls:
      net.core.somaxconn: 1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  django:
    restart: always
    env_file:
      - .env
    image: ${BACKEND_IMAGE}
    command: bash -c "DJANGO_SETTINGS_MODULE=backend.settings python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --workers=${GUNICORN_WORKERS} --log-file=${GUNICORN_LOG}/gunicorn.log --log-level=${GUNICORN_LOG_LEVEL} -b '[::]:80' --worker-tmp-dir /dev/shm --timeout ${GUNICORN_TIMEOUT} --max-requests=${GUNICORN_MAX_REQUESTS:-500}"
    volumes:
      - ${STATIC_ROOT}:${STATIC_ROOT}
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ${GUNICORN_LOG}:${GUNICORN_LOG}
      - ${DJANGO_LOG_DIR}:${DJANGO_LOG_DIR}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",80),2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Loopback only, here and below: nginx on the host is the public entry.
    ports:
      - "127.0.0.1:${EXTERNAL_PORT_PRODUCTION}:80"
  fastapi:
    restart: always
    env_file:
      - .env
    image: ${BACKEND_IMAGE}
    # FASTAPI_WORKERS processes serve /api/v2 (default 1). One process queues
    # every request behind the one in progress; the app keeps no state in
    # memory (caches are in Redis), so workers can share the load safely.
    # About 320 MB of RAM each.
    # uvicorn directly, not `fastapi run`: the CLI imports the app (and with it
    # Django) in the parent process to find it, which held ~245 MB doing nothing.
    # Unlike the CLI, uvicorn binds 127.0.0.1 unless told otherwise.
    command: bash -c "uvicorn main:app --host 0.0.0.0 --root-path /api/v2 --port 80 --workers ${FASTAPI_WORKERS:-1} --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ${FASTAPI_LOG_DIR}:${FASTAPI_LOG_DIR}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",80),2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${FASTAPI_PORT}:80"
  neo4j:
    image: neo4j:5.26.33-enterprise-trixie
    restart: always
    # Docker's 10 s default can cut a shutdown checkpoint short.
    stop_grace_period: 60s
    ports:
      - 127.0.0.1:${NEO4J_7474_EXTERNAL_PORT}:7474
      - 127.0.0.1:${NEO4J_7687_EXTERNAL_PORT}:7687
    volumes:
      - ${NEO4J_CONF}:/conf
      - ${NEO4J_DATA}:/data
      - ${NEO4J_IMPORT}:/import
      - ${NEO4J_LOGS}:/logs
      - ${NEO4J_PLUGINS}:/plugins
      - ${NEO4J_BACKUP}:/backup
      - ${NEO4J_CERTIFICATES}:/ssl
    environment: 
      # Raise memory limits
      #- NEO4J_server_memory_pagecache_size=1G
      #- NEO4J_server_memory_heap_initial__size=1G
      #- NEO4J_server_memory_heap_max__size=1G
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_apoc_trigger_enabled=true
    healthcheck:
      test: wget -q --spider http://neo4j:7474 || exit 1
      interval: ${NEO4J_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${NEO4J_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${NEO4J_HEALTHCHECK_RETRIES:-30}
      start_period: ${NEO4J_HEALTHCHECK_START_PERIOD:-30s}

  rabbitmq:
    # Every other long-running service here restarts; without this one the
    # broker stays down after a reboot and celery waits on a broker that is
    # never coming back.
    restart: always
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      # Reach the management UI through an SSH tunnel:
      #   ssh -L 15672:127.0.0.1:15672 root@<server>
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      # Does the broker accept connections on its AMQP port — not
      # `rabbitmq-diagnostics ping`, which boots an Erlang node every 10s: on
      # the 2-vCPU production box that read as RabbitMQ at 100% CPU, as
      # Celery's `inspect ping` had before it. celery waits on this one, and
      # the port opens once the broker can take its connection.
      test: ["CMD-SHELL", "nc -z localhost 5672"]
      interval: 10s
      timeout: 10s
      retries: 5

  celery:
    restart: always
    env_file:
      - .env
    image: ${BACKEND_IMAGE}
    command: celery -A backend worker --loglevel=info
    volumes:
      - ${CELERY_LOG_DIR}:${CELERY_LOG_DIR}
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Is the worker process alive — not `celery inspect ping`, which starts a
      # new Python, loads Django and the whole app, every 10s: on the 2-vCPU
      # production box that was half a core (86% per check) spent on the
      # healthcheck while the worker itself sat idle. The worker reconnects to
      # RabbitMQ by itself, and no service waits on this one being healthy.
      # [c]elery, not celery: pgrep -f also reads the shell running this test,
      # whose command line contains the pattern — it matched itself and the
      # check passed even with no worker at all.
      test: ["CMD-SHELL", "pgrep -f '[c]elery -A backend worker' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s